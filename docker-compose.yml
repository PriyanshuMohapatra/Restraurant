version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    ports:
      - "8000:9000"
    volumes:
      - .:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: your-render-db-host  # Replace with your Render DB host URL
      DB_PORT: 3306  # Default MySQL port
      DB_DATABASE: restaurant  # Replace with your Render DB name
      DB_USERNAME: your-render-db-username  # Replace with your Render DB username
      DB_PASSWORD: your-render-db-password  # Replace with your Render DB password
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: restaurant
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
    driver: local
